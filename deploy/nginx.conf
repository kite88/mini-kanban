# =============================================================
# mini-kanban 统一入口（docker compose 环境）
#
#   浏览器 → nginx :80
#              ├── /api/     → server:8281 （Go 后端，保留 /api 前缀）
#              ├── /healthz  → server:8281
#              └── /         → web:3201   （next start）
#
# 前端 NEXT_PUBLIC_API_BASE 构建为相对路径 /api，走同源反代，天然规避 CORS。
# =============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # 附件为 multipart 上传：后端请求体上限 = storage.maxSizeMB × 10，
    # 默认 maxSizeMB=10 即 100m，网关侧必须不小于它，否则大附件会在 nginx 被 413 拦掉
    client_max_body_size 100m;

    # 长连接给上传 / 下载用，避免大文件被网关超时切断
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    upstream mini_kanban_server {
        server server:8281;
    }

    upstream mini_kanban_web {
        server web:3201;
    }

    server {
        listen 80;
        server_name _;

        # 后端接口：proxy_pass 不带尾斜杠，保留 /api 前缀
        location /api/ {
            proxy_pass http://mini_kanban_server;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 后端健康检查（含 Redis 状态）
        location = /healthz {
            proxy_pass http://mini_kanban_server/healthz;
            access_log off;
        }

        # 初始化配置向导不对公网暴露（配置就绪后它也只是反馈页，仍建议在网关层拦掉）
        location = /setup {
            return 404;
        }

        # 前端
        location / {
            proxy_pass http://mini_kanban_web;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
